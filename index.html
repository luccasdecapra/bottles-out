.dot{width:9px;height:9px;border-radius:50%;background:#c9a227}.dot.on{background:var(--ok)}.dot.off{background:var(--wine)}

.tabs button{border:0;background:none;font:inherit;font-weight:700;font-size:14px;padding:9px;border-radius:10px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.shift{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.shift button{border:0;background:none;font:inherit;font-weight:700;font-size:15px;padding:9px;border-radius:10px;color:var(--muted)}

 try{firebase.initializeApp(CFG);DB=firebase.database();ref=DB.ref("vinhos");}catch(e){usingLocal=true;return}

 dayRef.on("value",s=>{const v=s.val()||{};counts={giorno:v.giorno||{},notte:v.notte||{}};try{localStorage.setItem("vn:"+DAY,JSON.stringify(counts))}catch(e){}if(view==="conta")render()},e=>{usingLocal=true;toast("Sem permissão no Firebase")});

/* ---------- Contagem ---------- */
function chg(sl,d){
 if(!DB){toast("Sem conexão com Firebase");return}
 const w=BYSLUG[sl];if(!w)return;
 const cur=(counts[shift]||{})[sl]||0;
 if(d<0&&cur<=0)return;
 const now=Date.now(),sh=shift,day=DAY;
 ref.child("dias/"+day+"/cont/"+sh+"/"+sl).transaction(v=>{v=v||0;const n=v+d;return n<0?0:n},(err,ok,snap)=>{
  if(err||!ok){toast("Erro ao salvar");return}
  ref.child("dias/"+day+"/log").push({t:now,s:sh,k:sl,nm:full(w),d:d,by:user||""});
 });
 /* otimista: atualiza na hora */
 counts[sh][sl]=Math.max(0,cur+d);if(!counts[sh][sl])delete counts[sh][sl];render();
}

 const t=document.getElementById('q').value.trim().toLowerCase(),c=counts[shift]||{};let h=`<div class="day">${dlabel(DAY||dkey(bizDay()))}</div>`;
 for(const ct of ORDER){
  if(cat!=="Todas"&&cat!==ct)continue;
  const items=W.filter(w=>w[0]===ct&&(!t||full(w).toLowerCase().includes(t)));
  if(!items.length)continue;
  const sub=items.reduce((a,w)=>a+(c[slug(w)]||0),0);
  h+=`<div class="cat"><span>${CATLBL[ct]}</span><span>${sub||""}</span></div>`;
  for(const w of items){const k=slug(w),v=c[k]||0;
   h+=`<div class="item${v?' has':''}"><div class="nm"><div class="pr">${w[1]}</div><div class="n">${w[2]}</div></div>
   <div class="ctl"><button ${v?'':'disabled'} onclick="chg('${k}',-1)">−</button><span class="q${v?'':' z'}">${v}</span><button class="plus" onclick="chg('${k}',1)">+</button></div></div>`}
 }
 document.getElementById('list').innerHTML=h;
 document.getElementById('tG').textContent=tot(counts.giorno);document.getElementById('tN').textContent=tot(counts.notte);
 document.getElementById('bG').classList.toggle('on',shift==="giorno");document.getElementById('bN').classList.toggle('on',shift==="notte");
 document.getElementById('tt').textContent=tot(counts.giorno)+tot(counts.notte);
 document.getElementById('tl').textContent="Total do dia · garrafas";
}
function summaryText(day,cont){
 let out="🍷 Saída de vinhos · "+dlabel(day);
 for(const s of["giorno","notte"]){
  const c=(cont||{})[s]||{};const rows=Object.keys(c).filter(k=>c[k]>0).map(k=>[BYSLUG[k]?full(BYSLUG[k]):k,c[k]]);
  out+="\n\n"+(s==="giorno"?"☀️ GIORNO":"🌙 NOTTE")+" — "+tot(c)+" garrafas";
  rows.forEach(r=>out+="\n"+r[1]+"x "+r[0]);
 }
 out+="\n\nTOTAL DO DIA: "+(tot((cont||{}).giorno)+tot((cont||{}).notte));return out}
function copyText(txt){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Resumo copiado")).catch(()=>prompt("Copie o resumo:",txt))}
function copyToday(){copyText(summaryText(DAY,counts))}

/* ---------- Storico ---------- */
function renderStorico(){
 document.getElementById('list').innerHTML='<div class="empty">Carregando…</div>';
 if(!DB){document.getElementById('list').innerHTML='<div class="empty">Sem conexão.</div>';return}
 ref.child("dias").orderByKey().limitToLast(90).once("value").then(s=>{
  const v=s.val()||{};const keys=Object.keys(v).sort().reverse().filter(k=>{const c=v[k].cont||{};return tot(c.giorno)+tot(c.notte)>0});
  window._dias=v;
  if(!keys.length){document.getElementById('list').innerHTML='<div class="empty">Nenhum dia registrado ainda.</div>';return}
  document.getElementById('list').innerHTML=keys.map(k=>{const c=v[k].cont||{},g=tot(c.giorno),n=tot(c.notte);
   return `<div class="card" onclick="openDay('${k}')"><div class="d">${dlabel(k)}</div><div class="pills"><span class="pill">🍾 ${g+n}</span><span class="pill">☀️ ${g}</span><span class="pill">🌙 ${n}</span></div></div>`}).join("");
 }).catch(()=>{document.getElementById('list').innerHTML='<div class="empty">Sem permissão para ler o histórico.</div>'});
}
function openDay(k){
 const d=(window._dias||{})[k]||{},c=d.cont||{};
 let h=`<h2>${dlabel(k)}</h2><div class="pills"><span class="pill">🍾 ${tot(c.giorno)+tot(c.notte)} garrafas</span></div>`;
 for(const s of["giorno","notte"]){
  const o=c[s]||{},ks=Object.keys(o).filter(x=>o[x]>0);
  h+=`<div class="sec"><span>${s==="giorno"?"☀️ Giorno":"🌙 Notte"}</span><span>${tot(o)}</span></div>`;
  h+=ks.length?ks.sort((a,b)=>o[b]-o[a]).map(x=>`<div class="row"><span>${BYSLUG[x]?full(BYSLUG[x]):x}</span><b>${o[x]}</b></div>`).join(""):'<div class="log">Nada registrado.</div>';
 }
 const log=Object.values(d.log||{}).sort((a,b)=>a.t-b.t);
 if(log.length){h+=`<div class="sec"><span>Registro de horários</span><span>${log.length}</span></div>`+log.map(l=>`<div class="log">${hhmm(l.t)} · ${l.s==="giorno"?"☀️":"🌙"} ${l.d>0?"+1":"−1"} ${l.nm}${l.by?" · "+l.by:""}</div>`).join("")}
 h+=`<div class="btnrow"><button class="act" onclick="copyText(summaryText('${k}',window._dias['${k}'].cont))">Copiar resumo</button><button class="act" onclick="closeModal()">Fechar</button></div>`;
 openModal(h);
}
function openModal(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}

loadUser();DAY=dkey(bizDay());
try{counts=JSON.parse(localStorage.getItem("vn:"+DAY)||"null")||counts}catch(e){}
render();
if(!user)showLogin();
window.addEventListener("load",initFB);
</script></body></html>
